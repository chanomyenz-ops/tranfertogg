<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#d1d5db;--dark:#111827;--green:#047857;--amber:#92400e;--input:#fff;--soft:#f3f4f6}

label{display:block;font-weight:700;margin-bottom:8px}
textarea{width:100%;min-height:450px;border:1px solid var(--border);border-radius:10px;padding:12px;font:15px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;background:var(--input);color:var(--text)}

.primary{background:var(--dark);color:#fff}.secondary{background:var(--soft);color:var(--text)}.danger{background:#7f1d1d;color:#fff}.danger:hover{background:#991b1b}

  min-height:24px;
  margin-top:10px;
  font-size:16px;
  font-weight:700;

  background:#f9fafb;
  border-radius:10px;

}
.status:empty{
  display:none;
}

  color:#065f46;
  background:#ecfdf5;
  border-color:#a7f3d0;
}
.warn{
  color:#78350f;
  background:#fffbeb;
  border-color:#fde68a;
}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid var(--border);padding:8px 10px;text-align:center}th{background:var(--soft)}
.note{margin-top:14px;color:var(--muted);font-size:14px;line-height:1.7}
.uncertain{background:#fff7ed}
textarea::placeholder{color:#9ca3af;opacity:1}

body.dark table{color:var(--text)}
body.dark td,body.dark th{border-color:#475569}

body.dark .primary{background:#e5e7eb;color:#111827}
body.dark .secondary{background:#334155;color:#f8fafc}

body.dark #input{

}

label,
.card > strong{

  background:#4a3514 !important;
  color:#fde68a !important;
  border-color:#8a5a13 !important;
  font-weight:700;
}

  background:#4a3514 !important;
}

@media(max-width:760px){.grid{grid-template-columns:1fr}}

  position:fixed;
  top:12px;
  right:16px;
  z-index:9999;

  background:rgba(255,255,255,.88);

  backdrop-filter:blur(6px);
}

<body>
<div class="app-version">v83</div>
<div class="wrap">

<div class="grid">
  <div class="card">
    <label>ข้อความจาก LINE</label>
    <textarea id="input" placeholder="ตัวอย่าง:
บิล1
524 20x6
303 30x3"></textarea>
  </div>
  <div class="card">
    <label>ผลลัพธ์สำหรับ Google Sheets</label>
    <textarea id="output" readonly></textarea>

  </div>
</div>

<div class="actions">
  <button class="secondary" id="themeToggle" onclick="toggleTheme()">🌙 Dark</button>
  <button class="primary" onclick="convertOrder()">แปลงข้อมูล</button>
  <button class="secondary" onclick="copyOutput()">Copy</button>
  <button class="danger" onclick="clearAll()">Clear</button>
</div>

<div class="card">
  <strong>Preview</strong>
  <div id="preview"></div>
</div>

</div>

<script>
const MULT = "[*xX×❎✕✖+]";

function norm(s){ return s.replace(/,/g,""); }

function isNoise(line){
  if(!line) return false;
  if(/^\d{1,2}[.\-/]\d{1,2}[.\-/]\d{2,4}\b/.test(line) && /=/.test(line)) return true;
  if(/^\d{4}[.\-/]\d{1,2}[.\-/]\d{1,2}\b/.test(line)) return true;
  if(!/\d/.test(line) && !/บิล\s*\d+/i.test(line)) return true;
  return false;
}

function uniquePermutations(code){
  const chars = code.split("");
  const out = [];
  const used = new Set();

  function walk(prefix, remaining){
    if(remaining.length === 0){
      if(!used.has(prefix)){
        used.add(prefix);
        out.push(prefix);
      }
      return;
    }

    const local = new Set();
    for(let i=0;i<remaining.length;i++){
      const ch = remaining[i];
      if(local.has(ch)) continue;
      local.add(ch);
      const next = remaining.slice(0,i).concat(remaining.slice(i+1));
      walk(prefix + ch, next);
    }
  }

  walk("", chars);
  return out;
}

function orderedPermutations(code){
  // สำหรับเลข 3 หลัก ใช้ลำดับที่ผู้ใช้คุ้นเคย:
  // abc, acb, bac, bca, cab, cba แล้วตัดตัวซ้ำออก
  if(code.length === 3){
    const a=code[0], b=code[1], c=code[2];
    const arr=[a+b+c,a+c+b,b+a+c,b+c+a,c+a+b,c+b+a];
    return [...new Set(arr)];
  }
  return uniquePermutations(code);
}



function parseBlock(lines,bill){
  const items=[];
  let side="";
  let pendingBare=[];

  function flushPending(){
    for(const code of pendingBare){
      items.push({type:"bare",code,side});
    }
    pendingBare=[];
  }

  for(const lineRaw of lines){
    let line=lineRaw.trim();
    if(!line) continue;

    // แปลง emoji 💯 เป็น 100
    line=line.replace(/💯/g,"100");

    // รองรับการสะกด "ตัวล่ะ" ให้มีความหมายเหมือน "ตัวละ"
    line=line.replace(/ตัวล่ะ/g,"ตัวละ");

    // ถ้าเป็นหัวข้อความ LINE และลงท้ายด้วยเลข 1 หลัก + จุด เช่น "11:02 phoenix🐣 2."
    // ให้มองเลขนั้นเป็นข้อความประกอบ ไม่ใช่รหัส
    if(/^\d{1,2}:\d{2}\s/.test(line) && /\s\d\.$/.test(line)){
      line=line.replace(/\s\d\.$/,"").trim();
    }

    // รองรับ _ เป็นตัวคั่นระหว่างรหัสกับราคา เช่น 891_50*50
    line=line.replace(/^(\d{1,3})\s*_\s*(?=\d)/,"$1=");

    // อนุญาตให้มีจุดท้ายบรรทัด เช่น 30*30. หรือ 61 100*100.
    // ตัดเฉพาะจุดที่อยู่ท้ายสุด เพื่อไม่กระทบรูปแบบอื่น
    line=line.replace(/[.。]+\s*$/,"").trim();

    // รองรับรายการรหัสหลายตัวคั่นด้วย - ก่อนตรวจวันที่
    // สำคัญ: 03-22-39-30-93 ต้องเป็นรายการเลข ไม่ใช่ถูกมองเป็นวันที่
    const hyphenCodeList = line.match(/^(\d{1,3}(?:\s*-\s*\d{1,3}){2,})$/);
    if(hyphenCodeList){
      const codes = hyphenCodeList[1].split(/\s*-\s*/).filter(Boolean);
      for(const code of codes){
        items.push({type:"bare", code, side});
      }
      continue;
    }

    // รองรับรายการรหัสหลายตัวคั่นด้วย / และมีราคาในบรรทัดเดียวกัน
    // เช่น 09/90/39/93/03/30=100*100
    const slashInlinePrice = line.match(/^(\d{1,3}(?:\s*\/\s*\d{1,3})+)\s*=\s*([\d,]+)\s*[*xX×]\s*([\d,]+)$/);
    if(slashInlinePrice){
      const codes = slashInlinePrice[1].split(/\s*\/\s*/).filter(Boolean);
      const v1 = slashInlinePrice[2];
      const v2 = slashInlinePrice[3];
      for(const code of codes){
        items.push({type:"full2", code, v1, v2, side});
      }
      continue;
    }

    // ถ้าอยู่ใต้ บน/ล่าง และมีตัวเลข 2 ก้อน เช่น "14 100"
    // ให้ตีความเป็น รหัส + ราคาเดียว ก่อนกฎหลายรหัสคั่นด้วยช่องว่าง
    const sideSpacedSingleEarly = line.match(/^(\d{1,3})\s+([\d,]+)\s*$/);
    if((side==="top" || side==="bottom") && sideSpacedSingleEarly){
      flushPending();
      items.push({
        type:"full1",
        code:sideSpacedSingleEarly[1],
        price:norm(sideSpacedSingleEarly[2]),
        side
      });
      continue;
    }

    // รองรับรายการรหัสหลายตัวคั่นด้วยช่องว่าง
    // เช่น 875 261 611 919 527 619
    // เก็บเป็น bare ทีละตัว เพื่อให้ราคาอ้างอิงในบรรทัดถัดไป เช่น =40*40
    const spaceCodeList = line.match(/^(\d{1,3}(?:\s+\d{1,3}){1,})$/);
    if(spaceCodeList){
      const codes = spaceCodeList[1].trim().split(/\s+/).filter(Boolean);
      for(const code of codes){
        items.push({type:"bare", code, side});
      }
      continue;
    }

    // รองรับรายการรหัสหลายตัวคั่นด้วย /
    // เช่น 25/52/08/80/51/15/75/57 หรือ 11/33
    // กรณีมี 3 ส่วนพอดี เช่น 16/9/69 ให้ถือว่าอาจเป็นวันที่และปล่อยไปตรวจด้านล่าง
    const slashCodeList = line.match(/^(\d{1,3}(?:\s*\/\s*\d{1,3})+)$/);
    if(slashCodeList){
      const codes = slashCodeList[1].split(/\s*\/\s*/).filter(Boolean);
      if(codes.length !== 3){
        for(const code of codes){
          pendingBare.push(code);
        }
        continue;
      }
    }

    // ข้ามบรรทัดที่มีวันที่อยู่ตรงไหนก็ได้ เช่น
    // 16-9-69, 16/9/69, 16.9.69, "พี่ชมพู่16-9-69☔️40"
    if(/\d{1,4}[.\-/]\d{1,2}[.\-/]\d{1,4}/.test(line)) continue;

    if(/(?:^|\s)บน\.?(?:\s|$)/i.test(line)) side="top";
    if(/(?:^|\s)ล่าง\.?(?:\s|$)/i.test(line)) side="bottom";

    const threeDigitBetRe=/(\d{3})\s*(ตรง|โต๊ด|โต็ด|โตด)\s*=?\s*([\d,]+)/g;
    let m, found=false;
    while((m=threeDigitBetRe.exec(line))!==null){
      flushPending();
      items.push({type:"direct3",code:m[1],price:norm(m[3]),side:m[2]==="ตรง"?"top":"bottom"});
      found=true;
    }
    if(found) continue;

    // รองรับ "รหัส ราคา 3/6 กลับ"
    // เช่น 242 20 3 กลับ, 245 20 6 กลับ
    // เพิ่ม 3 และ 6 เป็นคู่เสมอ
    const reversePriceCountWords=line.match(/^(\d{3})\s+([\d,]+)\s+([36])\s*กลับ\s*$/);
    if(reversePriceCountWords){
      flushPending();
      items.push({
        type:"reverse",
        code:reversePriceCountWords[1],
        price:norm(reversePriceCountWords[2]),
        count:+reversePriceCountWords[3],
        side
      });
      continue;
    }

    // รองรับ "รหัส 3กลับ/6กลับ ตัวละราคา"
    // เช่น 795 6กลับ ตัวละ20, 141 3กลับ ตัวละ100
    const reversePerEach=line.match(/^(\d{3})\s+([36])\s*กลับ\s+ตัวละ\s*([\d,]+)\s*$/);
    if(reversePerEach){
      flushPending();
      items.push({
        type:"reverse",
        code:reversePerEach[1],
        price:norm(reversePerEach[3]),
        count:+reversePerEach[2],
        side
      });
      continue;
    }

    // กลับเลขแบบ "รหัส*จำนวนกลับ=ราคา"
    // 141*3กลับ=100 -> 3 กลับ ราคา 100
    // 014*6กลับ=50  -> 6 กลับ ราคา 50
    const reversePrefix=line.match(/^(\d{3})\s*[*xX×]\s*([36])\s*กลับ\s*=\s*([\d,]+)\s*$/);
    if(reversePrefix){
      flushPending();
      items.push({
        type:"reverse",
        code:reversePrefix[1],
        price:norm(reversePrefix[3]),
        count:+reversePrefix[2],
        side
      });
      continue;
    }

    // 3 กลับแบบมีราคาแยกแต่ละเลข:
    // 544=65×15×15 -> 544=65, 454=15, 445=15
    // 336=50×50×50 -> 336=50, 363=50, 633=50
    const reverseTriplePrices=line.match(/^(\d{3})\s*(?:=\s*|\s+)([\d,]+)\s*[*xX×]\s*([\d,]+)\s*[*xX×]\s*([\d,]+)\s*$/);
    if(reverseTriplePrices){
      flushPending();
      items.push({
        type:"reversePrices",
        code:reverseTriplePrices[1],
        prices:[
          norm(reverseTriplePrices[2]),
          norm(reverseTriplePrices[3]),
          norm(reverseTriplePrices[4])
        ],
        side
      });
      continue;
    }

    // รองรับรูปแบบที่มี * เกินหลัง = เช่น 116=*10*3=30
    // ตีความเหมือน 116=10*3=30 -> 3 กลับ ตัวละ 10, 30 คือยอดรวม
    const reverseWithLeadingStar=line.match(/^(\d{3})\s*=\s*[*xX×]\s*([\d,]+)\s*[*xX×]\s*([36])\s*=\s*([\d,]+)\s*$/);
    if(reverseWithLeadingStar){
      flushPending();
      items.push({
        type:"reverse",
        code:reverseWithLeadingStar[1],
        price:norm(reverseWithLeadingStar[2]),
        count:+reverseWithLeadingStar[3],
        total:norm(reverseWithLeadingStar[4]),
        side
      });
      continue;
    }

    // รองรับ "รหัส-ราคา*จำนวนกลับ=ยอดรวม"
    // เช่น 393-50*3=150 -> 3 กลับ ตัวละ 50 (150 คือยอดรวม)
    //      123-20*6=120 -> 6 กลับ ตัวละ 20 (120 คือยอดรวม)
    const reverseWithTotal=line.match(/^(\d{3})\s*(?:=|-)\s*([\d,]+)\s*[xX×*]\s*([36])\s*=\s*([\d,]+)\s*$/);
    if(reverseWithTotal){
      flushPending();
      items.push({
        type:"reverse",
        code:reverseWithTotal[1],
        price:norm(reverseWithTotal[2]),
        count:+reverseWithTotal[3],
        total:norm(reverseWithTotal[4]),
        side
      });
      continue;
    }

    const reverseEq=line.match(/(\d{3})\s*(?:=|-)\s*([\d,]+)\s*[xX×*]\s*([36])(?=\s*(?:กลับ|กับ)?\s*$)/);
    if(reverseEq){
      flushPending();
      items.push({type:"reverse",code:reverseEq[1],price:norm(reverseEq[2]),count:+reverseEq[3],side});
      continue;
    }

    // shorthand กลับเลขโดยไม่ต้องพิมพ์คำว่า "กลับ"
    // 976=30*6  -> 6 กลับ ราคา 30
    // 976=6*30  -> 6 กลับ ราคา 30
    // 303=30*3  -> 3 กลับ ราคา 30
    // 303=3*30  -> 3 กลับ ราคา 30
    const reverseShort=line.match(/^(\d{3})\s*(?:=|\s+)\s*([\d,]+)\s*[xX×*]\s*([\d,]+)\s*$/);
    if(reverseShort){
      const code=reverseShort[1];
      const a=norm(reverseShort[2]);
      const b=norm(reverseShort[3]);

      let count=null, price=null;

      if(a==="3" || a==="6"){
        count=parseInt(a,10);
        price=b;
      }else if(b==="3" || b==="6"){
        count=parseInt(b,10);
        price=a;
      }

      if(count){
        flushPending();
        items.push({type:"reverse",code,price,count,side});
        continue;
      }
    }

    const reverseX=line.match(/(\d{3})\s+([\d,]+)\s*[xX×*]\s*([36])\s*(?:กลับ)?(?:\s|$)/);
    if(reverseX){
      flushPending();
      items.push({type:"reverse",code:reverseX[1],price:norm(reverseX[2]),count:+reverseX[3],side});
      continue;
    }

    const reverseWord=line.match(/(\d{3})\s+([36])\s*กลับ\s*([\d,]+)/);
    if(reverseWord){
      flushPending();
      items.push({type:"reverse",code:reverseWord[1],price:norm(reverseWord[3]),count:+reverseWord[2],side});
      continue;
    }

    // ราคาเดียวแบบ "รหัส*ราคา" ใช้เฉพาะเมื่อมีบริบท บน/ล่าง
    // เพื่อไม่ให้ชนกับ floating ref ปกติ เช่น 30*30
    const sidedStarSingle=line.match(/^(\d{1,3})\s*[*xX×]\s*([\d,]+)\s*$/);
    if((side==="top" || side==="bottom") && sidedStarSingle){
      flushPending();
      items.push({
        type:"full1",
        code:sidedStarSingle[1],
        price:norm(sidedStarSingle[2]),
        side
      });
      continue;
    }

    const refOnly=line.match(/^-*\s*=?\s*([\d,]+)\s*[*xX×❎✕✖+]\s*([\d,]+)\s*-*\s*(?:ไม่กลับ)?\s*$/);
    if(refOnly){
      flushPending();
      items.push({type:"ref2",v1:norm(refOnly[1]),v2:norm(refOnly[2]),side});
      continue;
    }

    const multiCodesFull=/((?:\d+)(?:\s*[,/]\s*\d+)+)\s*(?:=|-)\s*([\d,]+)\s*[*xX×❎✕✖+]\s*([\d,]+)/g;
    let mc, foundMulti=false;
    while((mc=multiCodesFull.exec(line))!==null){
      flushPending();
      for(const code of mc[1].split(/[,/]/).map(x=>x.trim()).filter(Boolean)){
        items.push({type:"full2",code,v1:norm(mc[2]),v2:norm(mc[3]),side});
      }
      foundMulti=true;
    }
    if(foundMulti) continue;

    const multiFullRe=/(\d+)\s*(?:=|-)\s*([\d,]+)\s*[*xX×❎✕✖+]\s*([\d,]+)/g;
    let mf, foundFull=false;
    while((mf=multiFullRe.exec(line))!==null){
      flushPending();
      items.push({type:"full2",code:mf[1],v1:norm(mf[2]),v2:norm(mf[3]),side});
      foundFull=true;
    }
    if(foundFull) continue;

    const spacedFull=line.match(/(\d+)\s+([\d,]+)\s*[*xX×❎✕✖+]\s*([\d,]+)\s*$/);
    if(spacedFull){
      flushPending();
      items.push({type:"full2",code:spacedFull[1],v1:norm(spacedFull[2]),v2:norm(spacedFull[3]),side});
      continue;
    }

    // ราคาเดียวที่ระบุด้านไว้ในวงเล็บ เช่น 77=20(ล่าง), 35-20(บน)
    // คำในวงเล็บมี priority เหนือ side ที่สืบทอดจากบรรทัดก่อนหน้า
    const inlineSideSingle=line.match(/^(\d{1,3})\s*(?:=|-)\s*([\d,]+)\s*\(\s*(บน|ล่าง)\s*\)\s*$/i);
    if(inlineSideSingle){
      flushPending();
      items.push({
        type:"full1",
        code:inlineSideSingle[1],
        price:norm(inlineSideSingle[2]),
        side:inlineSideSingle[3]==="ล่าง" ? "bottom" : "top"
      });
      continue;
    }

    const singles=[...line.matchAll(/(\d+)\s*(?:=|-)\s*([\d,]+)(?!\s*[*xX×❎✕✖+]\s*[\d,]+)/g)];
    if(singles.length){
      flushPending();
      for(const sm of singles) items.push({type:"full1",code:sm[1],price:norm(sm[2]),side});
      continue;
    }

    // รองรับราคาอ้างอิงล้วนแบบ "ตัวละ A×B"
    // เช่น "ตัวละ 50x50" -> ใช้เป็น floating reference 50/50
    // สำหรับ bare codes ก่อนหน้าในกลุ่ม
    const perEachFull2=line.match(/^ตัวละ\s*([\d,]+)\s*[*xX×]\s*([\d,]+)\s*$/);
    if(perEachFull2){
      items.push({
        type:"ref2",
        v1:norm(perEachFull2[1]),
        v2:norm(perEachFull2[2]),
        side
      });
      continue;
    }

    // รองรับ "รหัส ตัวละA×B"
    // เช่น 53 ตัวละ50x50 -> รหัส 53 มีค่า 50/50
    // และใช้เป็น anchor ให้ bare codes ก่อนหน้าในกลุ่มได้
    const codePerEachFull2=line.match(/^(\d{1,3})\s+ตัวละ\s*([\d,]+)\s*[*xX×]\s*([\d,]+)\s*$/);
    if(codePerEachFull2){
      flushPending();
      items.push({
        type:"full2",
        code:codePerEachFull2[1],
        v1:norm(codePerEachFull2[2]),
        v2:norm(codePerEachFull2[3]),
        side
      });
      continue;
    }

    // รองรับ "รหัส + เว้นวรรค + ราคาเดียว"
    // เช่น 14 100, 98 200, 83 20
    // ใช้ side ปัจจุบัน (บน/ล่าง) เป็นตัวกำหนดว่าจะลงค่า1 หรือค่า2
    const spacedSingle=line.match(/^(\d{1,3})\s+([\d,]+)\s*$/);
    if(spacedSingle){
      flushPending();
      items.push({
        type:"full1",
        code:spacedSingle[1],
        price:norm(spacedSingle[2]),
        side
      });
      continue;
    }

    const trailingBare=line.match(/(?:^|\s)(\d{1,3})\s*$/);
    if(trailingBare && /^\d{1,2}:\d{2}\s+/.test(line)){
      pendingBare.push(trailingBare[1]);
      continue;
    }

    const bare=line.match(/^(\d+)$/);
    if(bare){
      pendingBare.push(bare[1]);
      continue;
    }

    flushPending();
  }

  flushPending();
  return {bill,items};
}

function parseInput(raw){
  const lines=raw.split(/\r?\n/);
  const messages=[];
  let current=[];

  function flushMessage(){
    if(current.some(x=>x.trim()!=="")) messages.push(current.slice());
    current=[];
  }

  for(const rawLine of lines){
    const line=rawLine.trim();
    if(/^\d{1,2}:\d{2}\s+/.test(line) && current.some(x=>x.trim()!=="")) flushMessage();
    current.push(line);
  }
  flushMessage();

  const blocks=[];

  for(const msg of messages){
    let bill="";
    for(const line of msg){
      // แบบปกติ: บิล57 / บิลที่ 57
      const bm=line.match(/บิล(?:ที่)?\s*(\d+)/i);
      if(bm){
        bill=bm[1];
        continue;
      }

      // แบบเลขบิล + จุด + ชื่อ อยู่ในหัว LINE เช่น
      // "11:49 Phonphan Khansali 13.หมิว" -> บิล 13
      const headerDotBill=line.match(/(?:^|\s)(\d{1,3})\.\s*[^\s]+\s*$/);
      if(headerDotBill){
        bill=headerDotBill[1];
        if(/^\d{1,2}:\d{2}\s+/.test(line)) continue;
      }

      // แบบขึ้นต้นด้วยเลขบิล + จุด + ชื่อ เช่น "17.พี่ปลา"
      const dotBill=line.match(/^\s*(\d{1,3})\.\s*\S+/);
      if(dotBill){
        bill=dotBill[1];
        continue;
      }

      // แบบหัว LINE: "14:22 Mai (57)" -> บิล 57
      if(/^\d{1,2}:\d{2}\s+/.test(line)){
        const pm=line.match(/\((\d+)\)\s*$/);
        if(pm) bill=pm[1];
      }
    }

    // ตัดทุกบรรทัดที่เป็น header/ป้ายเลขบิลออกจากการ parse รายการ
    // เช่น "13:48 Simon Pakin บิล 15" เพื่อไม่ให้ 15 กลายเป็นรหัส
    const cleaned=msg.filter(line=>{
      if(!line) return true;
      if(/บิล(?:ที่)?\s*\d+/i.test(line)) return false;
      if(/^\s*\d{1,3}\.\s*\S+/.test(line)) return false;
      if(/^\d{1,2}:\d{2}\s+.*(?:^|\s)\d{1,3}\.\S+\s*$/.test(line)) return false;
      return true;
    });

    let part=[];
    function flushPart(){
      if(part.some(x=>x.trim()!=="")){
        const parsed=parseBlock(part,bill);
        if(parsed.items.length) blocks.push(parsed);
      }
      part=[];
    }

    for(const line of cleaned){
      if(line==="") flushPart();
      else part.push(line);
    }
    flushPart();
  }

  // ถ้ากลุ่มถัดไปมีแต่ราคาอ้างอิง เช่น "10*10" หรือ "5*5"
  // และกลุ่มก่อนหน้ามีแต่รหัสเปล่า ให้รวมเข้าด้วยกัน
  // เพื่อรองรับรูปแบบ:
  // 365
  //
  // 10*10
  const merged=[];
  for(const block of blocks){
    const onlyRefs = block.items.length>0 && block.items.every(it => it.type==="ref2");
    const prev = merged.length ? merged[merged.length-1] : null;

    if(onlyRefs && prev && prev.bill===block.bill){
      const prevHasBare = prev.items.some(it => it.type==="bare");
      const prevHasAnyRef = prev.items.some(it => it.type==="ref2" || it.type==="full2");

      if(prevHasBare && !prevHasAnyRef){
        prev.items.push(...block.items);
        continue;
      }
    }

    merged.push(block);
  }

  return merged;
}

function isTwoValueRef(it){
  return it.type==="full2" || it.type==="ref2";
}

function inferReversePrices(items,index){
  // ใช้กับรหัส 3 ตัวที่พิมพ์เดี่ยวเท่านั้น
  const current=items[index];
  if(!current || current.type!=="bare" || !/^\d{3}$/.test(current.code)) return null;

  let prev=null, next=null;

  for(let i=index-1;i>=0;i--){
    const it=items[i];
    if(it.type==="reversePrices"){
      prev=it.prices;
      break;
    }
    // ถ้าเจอ reference ชนิดอื่นก่อน ให้หยุด เพื่อไม่ข้ามกลุ่มราคา
    if(it.type==="full2" || it.type==="full1" || it.type==="ref2" || it.type==="reverse") break;
  }

  for(let i=index+1;i<items.length;i++){
    const it=items[i];
    if(it.type==="reversePrices"){
      next=it.prices;
      break;
    }
    if(it.type==="full2" || it.type==="full1" || it.type==="ref2" || it.type==="reverse") break;
  }

  if(prev && next){
    if(prev.join("|")===next.join("|")) return prev;
    return null;
  }

  return prev || next || null;
}

function getSingleRef(it){
  if(it.type==="full1"){
    if(it.side==="top") return ["top",it.price];
    if(it.side==="bottom") return ["bottom",it.price];
  }
  return null;
}

function inferBare(items,index){
  const current = items[index];
  const side = current.side;

  if(side==="top" || side==="bottom"){
    let prev=null, next=null;
    for(let i=index-1;i>=0;i--){
      if(items[i].side!==side) continue;
      const r=getSingleRef(items[i]);
      if(r && r[0]===side){ prev={value:r[1],dist:index-i}; break; }
    }
    for(let i=index+1;i<items.length;i++){
      if(items[i].side!==side) continue;
      const r=getSingleRef(items[i]);
      if(r && r[0]===side){ next={value:r[1],dist:i-index}; break; }
    }
    if(prev && next){
      if(prev.value===next.value) return side==="top" ? [prev.value,""] : ["",prev.value];
      if(prev.dist < next.dist) return side==="top" ? [prev.value,""] : ["",prev.value];
      if(next.dist < prev.dist) return side==="top" ? [next.value,""] : ["",next.value];
      return null;
    }
    if(prev) return side==="top" ? [prev.value,""] : ["",prev.value];
    if(next) return side==="top" ? [next.value,""] : ["",next.value];
    return null;
  }

  const codeLen = current.code ? current.code.length : 0;

  // PRIORITY -1:
  // หา anchor ที่ "รหัสสอดคล้องกัน" ก่อน
  // เช่น 18 <-> 81, 16 <-> 61, 591 <-> 519 <-> 195
  // สำหรับรหัสยาวเท่ากัน ให้ถือว่าสอดคล้องกันถ้าใช้ชุดตัวเลขเดียวกัน
  function sameDigits(a,b){
    if(!a || !b || a.length!==b.length) return false;
    return a.split("").sort().join("") === b.split("").sort().join("");
  }

  // 1) ถ้ารหัสสอดคล้องกันกับรายการราคาเดียว (full1)
  // ให้ใช้ราคาเดียวก่อน fallback ไปหา 2 ค่า
  // เช่น 591=10 ... 519 915 951 159 ... 195=10
  // => ทั้งชุดใช้ค่า 1 = 10
  let prevRelatedSingle=null;
  let nextRelatedSingle=null;

  for(let i=index-1;i>=0;i--){
    const it=items[i];
    if(it.type==="full1" && it.code && sameDigits(current.code,it.code)){
      const singleValue = it.price ?? it.v1 ?? it.value ?? "";
      prevRelatedSingle={value:singleValue, side:it.side || "normal", dist:index-i};
      break;
    }
  }

  for(let i=index+1;i<items.length;i++){
    const it=items[i];
    if(it.type==="full1" && it.code && sameDigits(current.code,it.code)){
      const singleValue = it.price ?? it.v1 ?? it.value ?? "";
      nextRelatedSingle={value:singleValue, side:it.side || "normal", dist:i-index};
      break;
    }
  }

  if(prevRelatedSingle || nextRelatedSingle){
    let chosen=null;

    if(prevRelatedSingle && nextRelatedSingle){
      if(prevRelatedSingle.value===nextRelatedSingle.value){
        chosen=prevRelatedSingle;
      }else if(prevRelatedSingle.dist < nextRelatedSingle.dist){
        chosen=prevRelatedSingle;
      }else if(nextRelatedSingle.dist < prevRelatedSingle.dist){
        chosen=nextRelatedSingle;
      }else{
        return null;
      }
    }else{
      chosen=prevRelatedSingle || nextRelatedSingle;
    }

    if(chosen.side==="bottom") return ["",chosen.value];
    return [chosen.value,""];
  }

  // 2) ถัดมาค่อยหา anchor 2 ค่าที่รหัสสอดคล้องกัน
  let prevRelated=null;
  let nextRelated=null;

  for(let i=index-1;i>=0;i--){
    const it=items[i];
    if(it.type==="full2" && it.code && sameDigits(current.code,it.code)){
      prevRelated={value:[it.v1,it.v2],dist:index-i};
      break;
    }
  }

  for(let i=index+1;i<items.length;i++){
    const it=items[i];
    if(it.type==="full2" && it.code && sameDigits(current.code,it.code)){
      nextRelated={value:[it.v1,it.v2],dist:i-index};
      break;
    }
  }

  if(prevRelated || nextRelated){
    if(prevRelated && nextRelated){
      const sameValue =
        prevRelated.value[0]===nextRelated.value[0] &&
        prevRelated.value[1]===nextRelated.value[1];

      if(sameValue) return prevRelated.value;
      if(prevRelated.dist < nextRelated.dist) return prevRelated.value;
      if(nextRelated.dist < prevRelated.dist) return nextRelated.value;
      return null;
    }

    return prevRelated ? prevRelated.value : nextRelated.value;
  }

  // PRIORITY -0.5:
  // ถ้า "ไม่พบรหัสสอดคล้องกัน" ค่อยใช้ราคาเดียวจากรายการถัดไปเป็น anchor ของชุด bare
  // เช่น 01 / 10 / 00 / 77=20(ล่าง)
  // => 01,10,00 ใช้ค่า2=20 ตาม 77
  for(let i=index+1;i<items.length;i++){
    const it=items[i];

    if(it.type==="bare") continue;

    if(it.type==="full1"){
      const singleValue = it.price ?? it.v1 ?? it.value ?? "";
      if(it.side==="bottom") return ["",singleValue];
      return [singleValue,""];
    }

    break;
  }

  // PRIORITY 0:
  // ถ้ารหัสเดี่ยวอยู่ในชุด bare ที่ "ตามด้วย full2 ทันที"
  // ให้ full2 ด้านล่างเป็น anchor ของชุดนั้นก่อน
  // เช่น:
  // 18
  // 81 50*50
  // => 18 ใช้ 50*50
  for(let i=index+1;i<items.length;i++){
    const it=items[i];

    if(it.type==="bare") continue;

    if(it.type==="full2"){
      return [it.v1,it.v2];
    }

    // ถ้าเจอ reference/รายการชนิดอื่นก่อน แปลว่าไม่ใช่กลุ่มนี้
    break;
  }

  // 1) ref-only ที่ตามหลังชุดเลขเดี่ยว มี priority สูง
  for(let i=index+1;i<items.length;i++){
    const it=items[i];
    if(it.type==="bare") continue;
    if(it.type==="ref2") return [it.v1,it.v2];
    if(["full2","full1","reverse","reversePrices","direct3"].includes(it.type)) break;
  }

  // 2) anchor จำนวนหลักเดียวกัน
  let prevSame=null, nextSame=null;
  for(let i=index-1;i>=0;i--){
    const it=items[i];
    if(it.type==="full2" && it.code && it.code.length===codeLen){
      prevSame={value:[it.v1,it.v2],dist:index-i}; break;
    }
  }
  for(let i=index+1;i<items.length;i++){
    const it=items[i];
    if(it.type==="full2" && it.code && it.code.length===codeLen){
      nextSame={value:[it.v1,it.v2],dist:i-index}; break;
    }
  }
  if(prevSame || nextSame){
    if(prevSame && nextSame){
      const same = prevSame.value[0]===nextSame.value[0] && prevSame.value[1]===nextSame.value[1];
      if(same) return prevSame.value;
      if(prevSame.dist < nextSame.dist) return prevSame.value;
      if(nextSame.dist < prevSame.dist) return nextSame.value;
      return null;
    }
    return prevSame ? prevSame.value : nextSame.value;
  }

  // 3) ref-only ก่อน/หลัง
  let prevRef=null, nextRef=null;
  for(let i=index-1;i>=0;i--){
    const it=items[i];
    if(["full2","full1","reverse","reversePrices","direct3"].includes(it.type)) break;
    if(it.type==="ref2"){ prevRef={value:[it.v1,it.v2],dist:index-i}; break; }
  }
  for(let i=index+1;i<items.length;i++){
    const it=items[i];
    if(["full2","full1","reverse","reversePrices","direct3"].includes(it.type)) break;
    if(it.type==="ref2"){ nextRef={value:[it.v1,it.v2],dist:i-index}; break; }
  }
  if(prevRef && nextRef){
    const same = prevRef.value[0]===nextRef.value[0] && prevRef.value[1]===nextRef.value[1];
    if(same) return prevRef.value;
    if(prevRef.dist < nextRef.dist) return prevRef.value;
    if(nextRef.dist < prevRef.dist) return nextRef.value;
    return null;
  }
  if(prevRef) return prevRef.value;
  if(nextRef) return nextRef.value;

  // 4) fallback: ถ้าไม่มี anchor จำนวนหลักเดียวกัน ให้ใช้ full2 ที่ใกล้ที่สุด แม้คนละจำนวนหลัก
  let prevAny=null, nextAny=null;
  for(let i=index-1;i>=0;i--){
    const it=items[i];
    if(it.type==="full2"){ prevAny={value:[it.v1,it.v2],dist:index-i}; break; }
  }
  for(let i=index+1;i<items.length;i++){
    const it=items[i];
    if(it.type==="full2"){ nextAny={value:[it.v1,it.v2],dist:i-index}; break; }
  }
  if(prevAny && nextAny){
    const same = prevAny.value[0]===nextAny.value[0] && prevAny.value[1]===nextAny.value[1];
    if(same) return prevAny.value;
    if(prevAny.dist < nextAny.dist) return prevAny.value;
    if(nextAny.dist < prevAny.dist) return nextAny.value;
    return null;
  }
  if(prevAny) return prevAny.value;
  if(nextAny) return nextAny.value;

  return null;
}

function applyTheme(theme){
  const body=document.body;
  const btn=document.getElementById("themeToggle");

  if(theme==="dark"){
    body.classList.add("dark");
    if(btn) btn.textContent="☀️ Light";
  }else{
    body.classList.remove("dark");
    if(btn) btn.textContent="🌙 Dark";
  }

  localStorage.setItem("theme",theme);
}

function toggleTheme(){
  const isDark=document.body.classList.contains("dark");
  applyTheme(isDark ? "light" : "dark");
}

// ใช้ธีมล่าสุดที่ผู้ใช้เลือก ถ้ายังไม่เคยเลือกให้ตามระบบ
(function initTheme(){
  const saved=localStorage.getItem("theme");
  if(saved){
    applyTheme(saved);
  }else{
    const prefersDark=window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    applyTheme(prefersDark ? "dark" : "light");
  }
})();


document.addEventListener("DOMContentLoaded",()=>{
  const input=document.getElementById("input");
  if(input){
    input.addEventListener("keydown",(e)=>{
      // Enter = แปลงทันที, Shift+Enter = ขึ้นบรรทัดใหม่
      if(e.key==="Enter" && !e.shiftKey){
        e.preventDefault();
        convertOrder();
        setTimeout(()=>copyOutput(),0);
      }
    });
  }

function convertOrder(){
  const blocks=parseInput(document.getElementById("input").value);
  const rows=[];
  let uncertain=0;
  let reverseWarnings=0;

  for(const block of blocks){
    block.items.forEach((item,index)=>{
      if(item.type==="full2"){
        // ถ้ามี 2 ค่าอย่างชัดเจน ให้เก็บทั้งค่า 1 และค่า 2
        // คำว่า บน/ล่าง มีผลเฉพาะกรณีราคาเดียวเท่านั้น
        rows.push({values:[block.bill,item.code,item.v1,item.v2],uncertain:false});

      }else if(item.type==="direct3"){
        if(item.side==="bottom"){
          rows.push({values:[block.bill,item.code,"",item.price],uncertain:false});
        }else{
          rows.push({values:[block.bill,item.code,item.price,""],uncertain:false});
        }

      }else if(item.type==="full1"){
        if(item.side==="bottom"){
          rows.push({values:[block.bill,item.code,"",item.price],uncertain:false});
        }else{
          // default และ "บน" ลงค่า1
          rows.push({values:[block.bill,item.code,item.price,""],uncertain:false});
        }

      }else if(item.type==="reversePrices"){
        const perms=orderedPermutations(item.code).slice(0,3);

        for(let i=0;i<perms.length;i++){
          const price=item.prices[i] ?? "";
          if(item.side==="bottom"){
            rows.push({values:[block.bill,perms[i],"",price],uncertain:false});
          }else{
            rows.push({values:[block.bill,perms[i],price,""],uncertain:false});
          }
        }

        if(perms.length!==3){
          reverseWarnings++;
        }

      }else if(item.type==="reverse"){
        const perms=orderedPermutations(item.code);
        const selected=perms.slice(0,item.count);

        selected.forEach(code=>{
          if(item.side==="bottom"){
            rows.push({values:[block.bill,code,"",item.price],uncertain:false});
          }else{
            rows.push({values:[block.bill,code,item.price,""],uncertain:false});
          }
        });

        if(selected.length !== item.count){
          reverseWarnings++;
        }

      }else if(item.type==="uncertain"){
        rows.push({values:[block.bill,item.code,"",""],uncertain:true});
        uncertain++;

      }else if(item.type==="bare"){
        const reversePrices=inferReversePrices(block.items,index);

        if(reversePrices){
          const perms=orderedPermutations(item.code).slice(0,3);

          for(let i=0;i<perms.length;i++){
            const price=reversePrices[i] ?? "";
            if(item.side==="bottom"){
              rows.push({values:[block.bill,perms[i],"",price],uncertain:false});
            }else{
              rows.push({values:[block.bill,perms[i],price,""],uncertain:false});
            }
          }

          if(perms.length!==3){
            reverseWarnings++;
          }

        }else{
          const inferred=inferBare(block.items,index);
          if(inferred){
            rows.push({values:[block.bill,item.code,inferred[0],inferred[1]],uncertain:false});
          }else{
            rows.push({values:[block.bill,item.code,"",""],uncertain:true});
            uncertain++;
          }
        }
      }
    });
  }

  document.getElementById("output").value=
    rows.map(r=>r.values.join("\t")).join("\n");

  renderPreview(rows);

  const status=document.getElementById("status");
  if(uncertain || reverseWarnings){
    let msg=`แปลง ${rows.length} รายการ`;
    if(uncertain) msg+=` • มี ${uncertain} รายการที่ไม่แน่ใจ จึงเว้นว่าง`;
    if(reverseWarnings) msg+=` • พบคำสั่งกลับเลขที่จำนวนเลขไม่ตรง ${reverseWarnings} จุด`;
    status.textContent=msg;
    status.className="status warn";
  }else{
    status.textContent=`แปลงสำเร็จ ${rows.length} รายการ`;
    status.className="status ok";
  }
}

function renderPreview(rows){
  const preview=document.getElementById("preview");
  preview.innerHTML="";
  if(!rows.length)return;

  const table=document.createElement("table");
  table.innerHTML="<thead><tr><th>บิล</th><th>รหัส</th><th>ค่า 1</th><th>ค่า 2</th></tr></thead>";
  const tbody=document.createElement("tbody");

  rows.forEach(row=>{
    const tr=document.createElement("tr");
    if(row.uncertain) tr.className="uncertain";

    row.values.forEach(v=>{
      const td=document.createElement("td");
      td.textContent=v;
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  preview.appendChild(table);
}

async function copyOutput(){
  const output=document.getElementById("output");
  const status=document.getElementById("status");
  if(!output.value)return;

  try{
    await navigator.clipboard.writeText(output.value);
  }catch{
    output.select();
    document.execCommand("copy");
  }

  status.textContent="Copy แล้ว — Paste ลง Google Sheets ได้เลย";
  status.className="status ok";
}

function clearAll(){
  document.getElementById("input").value="";
  document.getElementById("output").value="";
  document.getElementById("preview").innerHTML="";
  document.getElementById("status").textContent="";
}
</script>
